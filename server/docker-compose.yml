services:
  rustfs-perms:
    image: alpine:3.20
    container_name: cinemate-rustfs-perms
    command: sh -c "chown -R 10001:10001 /data"
    volumes:
      - cinemate-rustfs-data:/data
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: cinemate-rustfs
    restart: unless-stopped
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cinemate-rustfs-data:/data

  mysql:
    image: mysql:8.4
    container_name: cinemate-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cinemate
      MYSQL_USER: cinemate
      MYSQL_PASSWORD: cinemate
    ports:
      - "3306:3306"
    volumes:
      - cinemate-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -ucinemate -pcinemate --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinemate-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://cinemate:cinemate@mysql:3306/cinemate
      DATABASE_POOL_SIZE: 10
      DRIZZLE_MIGRATIONS_DIR: /app/drizzle
      APP_BASE_URL: http://localhost:3000
      OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ACCESS_KEY: rustfsadmin
      OBJECT_STORAGE_SECRET_KEY: rustfsadmin
      OBJECT_STORAGE_BUCKET: cinemate-images
      IDEMPOTENCY_FLAG: "false"
      IDEMPOTENCY_TTL_HOURS: 24
      JWT_ACCESS_SECRET: change-me-user-access-secret
      JWT_REFRESH_SECRET: change-me-user-refresh-secret
      JWT_ADMIN_ACCESS_SECRET: change-me-admin-access-secret
      JWT_ADMIN_REFRESH_SECRET: change-me-admin-refresh-secret
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@cinemate.local
      ADMIN_PASSWORD: Admin@123456
      XENDIT_API_KEY: ""
      XENDIT_CALLBACK_TOKEN: ""
      XENDIT_INVOICE_DURATION_SECONDS: 86400
      FRONTEND_SUCCESS_URL: http://localhost:5173/payment/success
      FRONTEND_FAILURE_URL: http://localhost:5173/payment/failed
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: cinemate-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: cinemate
      PMA_PASSWORD: cinemate
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"

volumes:
  cinemate-mysql-data:
  cinemate-rustfs-data:
