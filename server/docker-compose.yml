services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinemate-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: /app/data/cinemate.db
      DRIZZLE_MIGRATIONS_DIR: /app/drizzle
      JWT_ACCESS_SECRET: change-me-user-access-secret
      JWT_REFRESH_SECRET: change-me-user-refresh-secret
      JWT_ADMIN_ACCESS_SECRET: change-me-admin-access-secret
      JWT_ADMIN_REFRESH_SECRET: change-me-admin-refresh-secret
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@cinemate.local
      ADMIN_PASSWORD: Admin@123456
      XENDIT_API_KEY: ""
      XENDIT_CALLBACK_TOKEN: ""
      XENDIT_INVOICE_DURATION_SECONDS: 86400
      FRONTEND_SUCCESS_URL: http://localhost:5173/payment/success
      FRONTEND_FAILURE_URL: http://localhost:5173/payment/failed
    volumes:
      - cinemate-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cinemate-data:
